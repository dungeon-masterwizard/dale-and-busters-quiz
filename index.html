<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dale & Busters Quiz</title>

    <link rel="icon" type="image/png" href="/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRO -->
    <div id="intro-screen">
        <p id="intro-text"></p>
    </div>


    <!-- READY SCREEN -->
    <div id="ready-screen">
    
        <h1>ARE YOU READY?</h1>
    
        <div id="ready-buttons">
            <button id="yes-button">YES</button>
            <button id="no-button">NO</button>
        </div>
    
        <p id="ready-message"></p>
    
    </div>

    
    <!-- QUESTION SCREEN -->
    <div id="question-screen">

        <h1>DALE & BUSTERS</h1>
        <h2>The Campaign Quiz</h2>

        <p id="question">Where did the party originally meet?</p>

        <div id="answers">
            <button>A) The Wet Trout</button>
            <button>B) The Lucky Liar</button>
            <button>C) The Northlook</button>
            <button>D) Hook, Line & Sinker</button>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
