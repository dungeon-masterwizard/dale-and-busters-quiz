<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dale & Busters Quiz</title>

    <link rel="icon" type="image/png" href="/favicon-32x32.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto+Slab:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- INTRO -->
    <div id="intro-screen">
        <p id="intro-text"></p>
    </div>


    <!-- READY SCREEN -->
    <div id="ready-screen">
    
        <h1>ARE YOU READY?</h1>
    
        <div id="ready-buttons">
            <button id="yes-button">YES</button>
            <button id="no-button">NO</button>
        </div>
    
        <p id="ready-message"></p>
    
    </div>

        
      <!-- QUESTION SCREEN -->
    <div id="question-screen">
    
        <h1 id="question-number">QUESTION 1</h1>
    
        <p id="question"></p>
    
        <div id="answers">
    
            <button id="answer-a"></button>
            <button id="answer-b"></button>
            <button id="answer-c"></button>
            <button id="answer-d"></button>
    
        </div>
    
    </div>
    
    <!-- RESULT SCREEN -->
    <div id="result-screen">
    
        <h1 id="result"></h1>
    
        <p id="explanation"></p>
    
        <button id="next-button">CONTINUE</button>
    
    </div>



<!-- NEXT QUESTION MENU -->
<div id="next-menu">

    <h1>NEXT QUESTION?</h1>

    <div id="next-buttons">
        <button id="next-yes">YES</button>
        <button id="next-no">NO</button>
    </div>

</div>


<!-- TAKE YOUR TIME MENU -->
<div id="info-menu">

    <h1>TAKE YOUR TIME</h1>

    <p>Anything you would like to see?</p>

    <div id="info-buttons">

        <button id="score-button">
            A) How many points do I have?
        </button>

        <button id="question-button">
            B) What question am I on?
        </button>

        <button id="creator-button">
            C) Who made this quiz?
        </button>

        <button id="tested-button">
            D) What is tested in this quiz?
        </button>

        <button id="info-back">
            E) No
        </button>

    </div>

    <p id="info-display"></p>

</div>
       <script src="script.js"></script>
</body>
</html>
